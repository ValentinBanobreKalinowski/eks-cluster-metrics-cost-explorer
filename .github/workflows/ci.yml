name: CI

# Runs on every PR into main, and on main itself so the README badge reflects main's state.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch/PR cancels the now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only need to read the repo.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Matches node:22-alpine in the Dockerfile
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npm run build # tsc

  docker:
    name: Docker build + scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Let both images report even if one fails
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.app }}
          push: false
          load: true # Keep the image in the local daemon so Trivy can scan it
          tags: cost-explorer-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: cost-explorer-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0" # Report only for now; switch to "1" to make it blocking

  terraform:
    name: Terraform (fmt + validate + scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false # Downloads providers/modules without AWS credentials or state
      - run: terraform validate
      - name: Scan Terraform for misconfigurations
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: CRITICAL,HIGH
          exit-code: "0" # Report only for now; switch to "1" to make it blocking

  helm:
    name: Helm (lint + template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint cost-explorer-chart
      - name: Render chart (local profile)
        run: helm template cost-explorer-chart > /dev/null
      - name: Render chart (EKS profile)
        # Mirrors the setValues in skaffold.yaml's eks profile, with placeholder values only
        run: |
          helm template cost-explorer-chart \
            --set deployInClusterPostgres=false \
            --set frontendServiceType=LoadBalancer \
            --set backendPostgresIamAuth=true \
            --set backendPostgresSsl=true \
            --set frontendCertArn=arn:aws:acm:eu-west-1:000000000000:certificate/placeholder \
            > /dev/null
